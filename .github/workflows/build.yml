name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Run checks
        run: make check

  office-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Run office render checks in the pinned container
        run: mise run check-office-docker

      - name: Upload office render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-render
          path: output/office-render/

  release-needed:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.changed.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for resume artifact changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual release requested for ${GITHUB_SHA}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git show --pretty='' --name-only HEAD)"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          artifact_paths='^(resume\.yaml|schema/.*|templates/.*|scripts/.*|pyproject\.toml|uv\.lock|Makefile|mise\.toml|\.devcontainer/(office-check\.Dockerfile|fontconfig\.conf))$'
          if printf '%s\n' "$changed_files" | grep -Eq "$artifact_paths"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    if: needs.release-needed.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    needs:
      - validate
      - office-render
      - release-needed
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Set release build date
        run: echo "RESUME_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Set release build SHA
        run: echo "RESUME_BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: mise run render-release-docker

      - name: Export build metadata
        id: metadata
        run: mise exec -- uv run python scripts/print_build_metadata.py >> "$GITHUB_OUTPUT"

      - name: Validate local release contract
        run: >-
          mise exec -- uv run python .github/scripts/check_release_contract.py
          --source-sha "${GITHUB_SHA}"
          --release-tag "${{ steps.metadata.outputs.release_tag }}"

      - name: Create stable public release assets
        run: |
          set -euo pipefail
          mkdir -p output/release-assets
          cp "${{ steps.metadata.outputs.markdown_asset }}" output/release-assets/resume.md
          cp "${{ steps.metadata.outputs.structured_markdown_asset }}" output/release-assets/resume.structured.md
          cp "${{ steps.metadata.outputs.docx_asset }}" output/release-assets/resume.docx
          cp "${{ steps.metadata.outputs.pdf_asset }}" output/release-assets/resume.pdf

      - name: Create draft GitHub release and upload assets
        id: draft_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Resume ${{ steps.metadata.outputs.release_tag }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.metadata.outputs.markdown_asset }}
            ${{ steps.metadata.outputs.structured_markdown_asset }}
            ${{ steps.metadata.outputs.docx_asset }}
            ${{ steps.metadata.outputs.pdf_asset }}
            output/release-assets/resume.md
            output/release-assets/resume.structured.md
            output/release-assets/resume.docx
            output/release-assets/resume.pdf

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${RUNNER_TEMP}/resume-release-draft.json"
          mise exec -- uv run python .github/scripts/check_release_contract.py \
            --source-sha "${GITHUB_SHA}" \
            --release-tag "${{ steps.metadata.outputs.release_tag }}" \
            --release-json "${RUNNER_TEMP}/resume-release-draft.json" \
            --expected-draft true

      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            > "${RUNNER_TEMP}/resume-release-published.json"
          mise exec -- uv run python .github/scripts/check_release_contract.py \
            --source-sha "${GITHUB_SHA}" \
            --release-tag "${{ steps.metadata.outputs.release_tag }}" \
            --release-json "${RUNNER_TEMP}/resume-release-published.json" \
            --expected-draft false
