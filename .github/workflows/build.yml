name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4.2.3

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Run checks
        run: make check

  artifact-changes:
    runs-on: ubuntu-latest
    outputs:
      should_render: ${{ steps.changed.outputs.should_render }}
      build_date: ${{ steps.metadata.outputs.build_date }}
      build_sha: ${{ steps.metadata.outputs.build_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for resume artifact changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual release requested for ${GITHUB_SHA}"
            echo "should_render=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${GITHUB_SHA}")"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            changed_files="$(git show --pretty='' --name-only HEAD)"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${GITHUB_SHA}")"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          artifact_paths='^(resume\.yaml|schema/.*|templates/.*|scripts/.*|pyproject\.toml|uv\.lock|Makefile|mise\.toml|\.devcontainer/(office-check\.Dockerfile|fontconfig\.conf))$'
          if printf '%s\n' "$changed_files" | grep -Eq "$artifact_paths"; then
            echo "should_render=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_render=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set build metadata
        id: metadata
        run: |
          echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "build_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  office-render:
    needs: artifact-changes
    if: needs.artifact-changes.outputs.should_render == 'true'
    runs-on: ubuntu-latest
    env:
      RESUME_BUILD_DATE: ${{ needs.artifact-changes.outputs.build_date }}
      RESUME_BUILD_SHA: ${{ needs.artifact-changes.outputs.build_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4.2.3

      - name: Run office render checks in the pinned container
        run: mise run check-office-docker

      - name: Upload office render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-render
          path: output/office-render/

      - name: Upload verified release artifacts
        if: >-
          github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-artifacts
          path: output/

  release:
    if: >-
      always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.artifact-changes.outputs.should_render == 'true'
      && needs.validate.result == 'success' && needs.office-render.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - validate
      - office-render
      - artifact-changes
    permissions:
      contents: write
    env:
      RESUME_BUILD_DATE: ${{ needs.artifact-changes.outputs.build_date }}
      RESUME_BUILD_SHA: ${{ needs.artifact-changes.outputs.build_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: verified-release-artifacts
          path: output

      - name: Install mise
        uses: jdx/mise-action@v4.2.3

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Export build metadata
        id: metadata
        run: mise exec -- uv run python scripts/print_build_metadata.py >> "$GITHUB_OUTPUT"

      - name: Validate local release contract
        run: >-
          mise exec -- uv run python .github/scripts/check_release_contract.py
          --source-sha "${GITHUB_SHA}"
          --release-tag "${{ steps.metadata.outputs.release_tag }}"

      # The release tag is v<date>-<short sha>, so distinct commits on the same
      # day get distinct tags. Re-running this workflow against a commit that
      # already released regenerates the identical tag, which would otherwise
      # collide with its own published release and fail the draft check. In
      # that case the release is already correct, so skip straight to the
      # redeploy notification, which is the only part worth repeating.
      - name: Check for an existing published release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          if release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
            if [[ "$(jq -r '.draft' <<<"${release_json}")" == "false" ]]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Release ${RELEASE_TAG} is already published for this commit. Skipping release creation; re-sending the redeploy notification only."
              exit 0
            fi
            echo "::notice::Release ${RELEASE_TAG} already exists as a draft and will be updated, then published."
          fi
          echo "published=false" >> "$GITHUB_OUTPUT"

      - name: Create stable public release assets
        id: stable_assets
        if: steps.existing_release.outputs.published != 'true'
        run: |
          set -euo pipefail
          stable_assets_dir="${RUNNER_TEMP}/resume-release-assets"
          mkdir -p "${stable_assets_dir}"
          cp "${{ steps.metadata.outputs.markdown_asset }}" "${stable_assets_dir}/resume.md"
          cp "${{ steps.metadata.outputs.structured_markdown_asset }}" "${stable_assets_dir}/resume.structured.md"
          cp "${{ steps.metadata.outputs.docx_asset }}" "${stable_assets_dir}/resume.docx"
          cp "${{ steps.metadata.outputs.pdf_asset }}" "${stable_assets_dir}/resume.pdf"
          echo "directory=${stable_assets_dir}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release and upload assets
        id: draft_release
        if: steps.existing_release.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Resume ${{ steps.metadata.outputs.release_tag }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.metadata.outputs.markdown_asset }}
            ${{ steps.metadata.outputs.structured_markdown_asset }}
            ${{ steps.metadata.outputs.docx_asset }}
            ${{ steps.metadata.outputs.pdf_asset }}
            ${{ steps.stable_assets.outputs.directory }}/resume.md
            ${{ steps.stable_assets.outputs.directory }}/resume.structured.md
            ${{ steps.stable_assets.outputs.directory }}/resume.docx
            ${{ steps.stable_assets.outputs.directory }}/resume.pdf

      - name: Verify draft release assets
        if: steps.existing_release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${RUNNER_TEMP}/resume-release-draft.json"
          mise exec -- uv run python .github/scripts/check_release_contract.py \
            --source-sha "${GITHUB_SHA}" \
            --release-tag "${{ steps.metadata.outputs.release_tag }}" \
            --release-json "${RUNNER_TEMP}/resume-release-draft.json" \
            --expected-draft true

      - name: Publish verified GitHub release
        if: steps.existing_release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            > "${RUNNER_TEMP}/resume-release-published.json"
          mise exec -- uv run python .github/scripts/check_release_contract.py \
            --source-sha "${GITHUB_SHA}" \
            --release-tag "${{ steps.metadata.outputs.release_tag }}" \
            --release-json "${RUNNER_TEMP}/resume-release-published.json" \
            --expected-draft false

      # thoughts self-hosts resume.md/resume.structured.md from `latest` at
      # its own deploy time (agent fetch tools reject the redirect + generic
      # octet-stream content type on a direct release-asset download). This
      # nudges it to redeploy now instead of waiting for its next unrelated
      # commit, so the self-hosted copy doesn't lag behind this release.
      # Soft-fails: a missing/invalid secret must not mark an otherwise
      # successful resume release as failed.
      - name: Notify thoughts to redeploy with the new resume
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.THOUGHTS_DISPATCH_TOKEN }}
        run: |
          stale_warning="fleig.us will keep serving the previously deployed resume until its next commit or a manual run of its deploy workflow."
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::warning::THOUGHTS_DISPATCH_TOKEN is not set. ${stale_warning}"
            exit 0
          fi
          if ! response=$(gh api repos/grubbyhacker/thoughts/dispatches \
            --method POST \
            -f event_type=resume-published 2>&1); then
            echo "::warning::Could not notify thoughts to redeploy: ${response//$'\n'/ }. ${stale_warning} Check that THOUGHTS_DISPATCH_TOKEN grants Contents: read and write on grubbyhacker/thoughts and has not expired."
            exit 0
          fi
          echo "::notice::Notified thoughts to redeploy with the new resume."
