name: Build

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Run checks
        run: make check

  office-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install office render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Run office render checks
        run: make check-office

      - name: Upload office render artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-render
          path: output/office-render/

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - validate
      - office-render
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install release render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils fonts-liberation

      - name: Install toolchain
        run: mise install

      - name: Install dependencies
        run: mise exec -- uv sync

      - name: Set release build date
        run: echo "RESUME_BUILD_DATE=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Set release build SHA
        run: echo "RESUME_BUILD_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        run: make render-markdown render-structured pdf

      - name: Export build metadata
        id: metadata
        run: mise exec -- uv run python scripts/print_build_metadata.py >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: Resume ${{ steps.metadata.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.metadata.outputs.markdown_asset }}
            ${{ steps.metadata.outputs.structured_markdown_asset }}
            ${{ steps.metadata.outputs.docx_asset }}
            ${{ steps.metadata.outputs.pdf_asset }}
